<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desk Data Toolkit: Trading and Banking</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mu:#5c6573;--bd:#e1e5eb;--ac:#1f4e8c;--ok:#1b7f4b;--wr:#b7791f;--er:#c0392b;--bar:#e8ebf0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141a;--card:#181e27;--tx:#e8ecf2;--mu:#9aa5b5;--bd:#2a3342;--ac:#6ea8ef;--ok:#4cc38a;--wr:#e2b04a;--er:#ef7a6c;--bar:#263042;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141a;--card:#181e27;--tx:#e8ecf2;--mu:#9aa5b5;--bd:#2a3342;--ac:#6ea8ef;--ok:#4cc38a;--wr:#e2b04a;--er:#ef7a6c;--bar:#263042;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:20px 0 8px}p.sub{color:var(--mu);margin:4px 0 14px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
button,input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:6px 10px}
.tab{background:var(--card);cursor:pointer}.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.k{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.v{font-size:24px;font-weight:650}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px}
.r{text-align:right}.mu{color:var(--mu);font-size:13px}
.tag{font-size:11.5px;padding:1px 8px;border-radius:99px;border:1px solid currentColor;margin-right:4px;display:inline-block}
.ff{position:relative;height:22px;background:var(--bar);border-radius:4px;margin:4px 0 12px}
.ff i{position:absolute;top:0;height:100%;background:var(--ac);opacity:.35;border-radius:4px}
.ff b{position:absolute;top:-3px;width:3px;height:28px;background:var(--ac)}
</style></head><body><main>
<h1>Desk Data Toolkit</h1>
<p class="sub">Two small tools showing how data analytics supports the front office. Synthetic data; everything runs in your browser.</p>
<div class="tabs"><button class="tab on" id="t1" onclick="tab(1)">Sales and trading: blotter controls</button><button class="tab" id="t2" onclick="tab(2)">Investment banking: comps check</button></div>
<div id="p1"></div><div id="p2" hidden></div>
<script>
var s=5;function rnd(){s=(s*1664525+1013904223)%4294967296;return s/4294967296}
function esc(v){return String(v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function tab(n){document.getElementById('p1').hidden=n!=1;document.getElementById('p2').hidden=n!=2;document.getElementById('t1').className='tab'+(n==1?' on':'');document.getElementById('t2').className='tab'+(n==2?' on':'')}
function fm(x,d){return x.toLocaleString(undefined,{maximumFractionDigits:d===undefined?1:d,minimumFractionDigits:d===undefined?0:d})}
/* ---------- Sales and trading ---------- */
var TK={Equities:['AAPL','MSFT','JPM','XOM','NVDA'],Credit:['ACME 7.5% 2031','BETA 6.25% 2029','GAMMA 8% 2030','DELTA 5.5% 2028'],Rates:['UST 2Y','UST 5Y','UST 10Y']};
var CP=['Citadel','Blackrock','Pimco','Fidelity','Millennium','Vanguard'],REF={},BL=[],CF={};
var TD='2026-10-16';
function addD(d,n){return new Date(new Date(d).getTime()+n*864e5).toISOString().slice(0,10)}
Object.keys(TK).forEach(function(d){TK[d].forEach(function(t){REF[t]=d=='Equities'?+(40+rnd()*400).toFixed(2):+(92+rnd()*14).toFixed(2)})});
for(var i=0;i<90;i++){var d=['Equities','Credit','Rates'][i%3],t=TK[d][Math.floor(rnd()*TK[d].length)],q=d=='Equities'?Math.round(1+rnd()*40)*1000:Math.round(1+rnd()*30)*1e6/10,p=+(REF[t]*(1+(rnd()-.5)*.012)).toFixed(2);
 var tr={id:'T'+(7000+i),desk:d,side:rnd()<.5?'Buy':'Sell',tk:t,qty:q,px:p,ref:REF[t],trade:TD,settle:addD(TD,d=='Equities'?3:1),cp:CP[Math.floor(rnd()*6)]};
 if(i%23==4)tr.px=+(tr.ref*1.09).toFixed(2);if(i%29==7)tr.cp='';if(i%31==9)tr.settle=addD(TD,-2);if(i%37==11)tr.qty*=15;
 BL.push(tr);if(i%19!=6)CF[tr.id]={qty:i%17==3?tr.qty-1000:tr.qty,px:i%26==5?+(tr.px+0.25).toFixed(2):tr.px}}
function notional(t){return t.desk=='Equities'?t.qty*t.px:t.qty*t.px/100}
var TOL=3,LIM=50;
function runBL(){var ex=[],by={},bd={};
 BL.forEach(function(t){var r=[],dev=Math.abs(t.px/t.ref-1)*100,n=notional(t),c=CF[t.id],dd=(new Date(t.settle)-new Date(t.trade))/864e5;
  if(dev>TOL)r.push('Price '+dev.toFixed(1)+'% from ref');if(n>LIM*1e6)r.push('Over notional limit');if(!t.cp)r.push('No counterparty');
  if(dd<0||dd>4)r.push('Bad settle date');if(!c)r.push('Not on confirm feed');else if(c.qty!=t.qty||c.px!=t.px)r.push('Confirm mismatch');
  bd[t.desk]=bd[t.desk]||{n:0,v:0,e:0};bd[t.desk].n++;bd[t.desk].v+=n;if(r.length){bd[t.desk].e++;ex.push({t:t,r:r,n:n});r.forEach(function(x){var k=x.replace(/[\d.]+%/,'x%');by[k]=(by[k]||0)+1})}});
 return {ex:ex.sort(function(a,b){return b.n-a.n}),by:by,bd:bd}}
function drawBL(){var R=runBL(),tot=BL.reduce(function(a,t){return a+notional(t)},0),h='';
 h+='<div class="card"><div class="row"><span>Price tolerance vs reference (%)</span><input size="4" value="'+TOL+'" onchange="TOL=+this.value||0;drawBL()"><span>Notional limit ($M)</span><input size="5" value="'+LIM+'" onchange="LIM=+this.value||0;drawBL()"></div></div>';
 h+='<div class="cards"><div class="card"><div class="k">Trades</div><div class="v">'+BL.length+'</div></div><div class="card"><div class="k">Notional</div><div class="v">$'+fm(tot/1e6,0)+'M</div></div><div class="card"><div class="k">With exceptions</div><div class="v">'+R.ex.length+'</div></div><div class="card"><div class="k">Exception rate</div><div class="v">'+(100*R.ex.length/BL.length).toFixed(0)+'%</div></div></div>';
 h+='<div class="row" style="align-items:flex-start"><div class="card wrap" style="flex:1;min-width:260px"><table><thead><tr><th>Control</th><th class="r">Breaks</th></tr></thead><tbody>'+Object.keys(R.by).map(function(k){return '<tr><td>'+esc(k)+'</td><td class="r">'+R.by[k]+'</td></tr>'}).join('')+'</tbody></table></div>';
 h+='<div class="card wrap" style="flex:1;min-width:260px"><table><thead><tr><th>Desk</th><th class="r">Trades</th><th class="r">Notional $M</th><th class="r">Exceptions</th></tr></thead><tbody>'+Object.keys(R.bd).map(function(k){var b=R.bd[k];return '<tr><td>'+k+'</td><td class="r">'+b.n+'</td><td class="r">'+fm(b.v/1e6,0)+'</td><td class="r">'+b.e+'</td></tr>'}).join('')+'</tbody></table></div></div>';
 h+='<h2>Exceptions, largest notional first</h2><div class="card wrap"><table><thead><tr><th>Trade</th><th>Desk</th><th>Side</th><th>Instrument</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Ref</th><th class="r">Notional $M</th><th>Counterparty</th><th>Issues</th></tr></thead><tbody>'+
 R.ex.slice(0,20).map(function(e){var t=e.t;return '<tr><td>'+t.id+'</td><td>'+t.desk+'</td><td>'+t.side+'</td><td>'+esc(t.tk)+'</td><td class="r">'+fm(t.qty,0)+'</td><td class="r">'+t.px+'</td><td class="r">'+t.ref+'</td><td class="r">'+fm(e.n/1e6,1)+'</td><td>'+(t.cp||'<i>(blank)</i>')+'</td><td>'+e.r.map(function(x){return '<span class="tag" style="color:var(--er)">'+esc(x)+'</span>'}).join('')+'</td></tr>'}).join('')+'</tbody></table><p class="mu">Showing '+Math.min(20,R.ex.length)+' of '+R.ex.length+'. Same logic would run as SQL against the trade capture and confirmation tables.</p></div>';
 document.getElementById('p1').innerHTML=h}
/* ---------- Investment banking ---------- */
var CO=[['Northwind Software',8200,1100,330],['Contoso Cloud',12400,1650,520],['Fabrikam Data',5600,720,210],['Tailspin Systems',3100,540,95],['Litware Analytics',9800,1250,400],['Adatum Security',2400,310,-40],['Proseware Apps',15300,1900,690],['Wingtip Platforms',4200,600,12],['Lucerne Networks',7100,980,300],['Humongous Infra',6400,880,260]];
var EXC=true,TE=250,TR=1000,ND=600;
function med(a){a=a.slice().sort(function(x,y){return x-y});var n=a.length;return n?(n%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2):0}
function qt(a,p){a=a.slice().sort(function(x,y){return x-y});var i=(a.length-1)*p,l=Math.floor(i);return a[l]+(a[Math.min(l+1,a.length-1)]-a[l])*(i-l)}
function drawIB(){var rows=CO.map(function(c){return {n:c[0],ev:c[1],rv:c[2],eb:c[3],m1:c[1]/c[2],m2:c[3]>0?c[1]/c[3]:null,mg:100*c[3]/c[2]}});
 var mm=med(rows.filter(function(r){return r.m2}).map(function(r){return r.m2}));
 rows.forEach(function(r){r.fl=[];if(r.m2===null)r.fl.push('NM: EBITDA ≤ 0');else if(r.m2>2*mm||r.m2<mm/2)r.fl.push('EV/EBITDA '+(r.m2>mm?'>2x':'<0.5x')+' median');if(r.mg<5&&r.m2!==null)r.fl.push('Margin '+r.mg.toFixed(0)+'%, check EBITDA')});
 function use(r,k){return r[k]!==null&&(!EXC||!r.fl.length)}
 var h='<div class="card"><div class="row"><label><input type="checkbox" '+(EXC?'checked':'')+' onchange="EXC=this.checked;drawIB()"> Exclude flagged comps from statistics</label><span>Target EBITDA ($M)</span><input size="6" value="'+TE+'" onchange="TE=+this.value||0;drawIB()"><span>Target revenue ($M)</span><input size="6" value="'+TR+'" onchange="TR=+this.value||0;drawIB()"><span>Net debt ($M)</span><input size="6" value="'+ND+'" onchange="ND=+this.value||0;drawIB()"></div></div>';
 h+='<div class="card wrap"><table><thead><tr><th>Company</th><th class="r">EV $M</th><th class="r">Revenue</th><th class="r">EBITDA</th><th class="r">EV/Rev</th><th class="r">EV/EBITDA</th><th>Data checks</th></tr></thead><tbody>'+
 rows.map(function(r){return '<tr><td>'+r.n+'</td><td class="r">'+fm(r.ev,0)+'</td><td class="r">'+fm(r.rv,0)+'</td><td class="r">'+fm(r.eb,0)+'</td><td class="r">'+r.m1.toFixed(1)+'x</td><td class="r">'+(r.m2===null?'NM':r.m2.toFixed(1)+'x')+'</td><td>'+(r.fl.length?r.fl.map(function(x){return '<span class="tag" style="color:var(--wr)">'+x+'</span>'}).join(''):'<span class="tag" style="color:var(--ok)">OK</span>')+'</td></tr>'}).join('')+'</tbody></table></div>';
 var st=[['EV/Revenue','m1',TR],['EV/EBITDA','m2',TE]],hi=0,out=st.map(function(x){var v=rows.filter(function(r){return use(r,x[1])}).map(function(r){return r[x[1]]}),o={l:x[0],n:v.length,lo:Math.min.apply(0,v),q1:qt(v,.25),md:med(v),q3:qt(v,.75),hi:Math.max.apply(0,v),m:x[2]};o.a=o.q1*o.m-ND;o.b=o.q3*o.m-ND;o.c=o.md*o.m-ND;hi=Math.max(hi,o.b);return o});
 h+='<div class="card wrap"><table><thead><tr><th>Statistic</th><th class="r">n</th><th class="r">Low</th><th class="r">25th</th><th class="r">Median</th><th class="r">75th</th><th class="r">High</th></tr></thead><tbody>'+out.map(function(o){return '<tr><td>'+o.l+'</td><td class="r">'+o.n+'</td>'+[o.lo,o.q1,o.md,o.q3,o.hi].map(function(x){return '<td class="r">'+x.toFixed(1)+'x</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>';
 h+='<h2>Implied equity value of target ($M), 25th to 75th percentile</h2><div class="card">'+out.map(function(o){return '<div class="mu">'+o.l+': $'+fm(o.a,0)+'M to $'+fm(o.b,0)+'M (median $'+fm(o.c,0)+'M)</div><div class="ff"><i style="left:'+100*Math.max(o.a,0)/hi+'%;width:'+100*(o.b-Math.max(o.a,0))/hi+'%"></i><b style="left:'+100*Math.max(o.c,0)/hi+'%"></b></div>'}).join('')+'<p class="mu">Implied equity = multiple × target metric − net debt. Flagged comps are shown but can be excluded so one outlier doesn’t skew the range.</p></div>';
 document.getElementById('p2').innerHTML=h}
drawBL();drawIB();
</script></main></body></html>
