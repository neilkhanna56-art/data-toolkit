<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Data Operations Hub</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mu:#5c6573;--bd:#e1e5eb;--ac:#1f4e8c;--ok:#1b7f4b;--wr:#b7791f;--er:#c0392b;--bar:#e8ebf0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141a;--card:#181e27;--tx:#e8ecf2;--mu:#9aa5b5;--bd:#2a3342;--ac:#6ea8ef;--ok:#4cc38a;--wr:#e2b04a;--er:#ef7a6c;--bar:#263042;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141a;--card:#181e27;--tx:#e8ecf2;--mu:#9aa5b5;--bd:#2a3342;--ac:#6ea8ef;--ok:#4cc38a;--wr:#e2b04a;--er:#ef7a6c;--bar:#263042;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:18px 0 8px}p.sub{color:var(--mu);margin:4px 0 14px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
button,input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:5px 9px}
.tab{background:var(--card);cursor:pointer}.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-bottom:12px}
.k{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.v{font-size:24px;font-weight:650}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px}
.r{text-align:right}.mu{color:var(--mu);font-size:13px}tr.c{cursor:pointer}tr.c:hover,tr.sel{background:var(--bar)}
.tag{font-size:11.5px;padding:1px 8px;border-radius:99px;border:1px solid currentColor;display:inline-block}
.ok{color:var(--ok)}.er{color:var(--er)}.wr{color:var(--wr)}
.bar{height:8px;background:var(--bar);border-radius:4px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--ac)}
ul{margin:6px 0 0;padding-left:20px}li{margin:4px 0}
</style></head><body><main>
<h1>Data Operations Hub</h1>
<p class="sub">One place to monitor data quality, resolve issues, track the close, check pipeline loads, and summarise results for senior staff. Synthetic data, as of 20 Oct 2026.</p>
<div id="app"></div>
<script>
var TODAY='2026-10-20',MON=['May','Jun','Jul','Aug','Sep','Oct'],T=0,CT=1,FD=2;
var R=[['Loan ID is unique','Uniqueness','loan_master',99.9,[100,100,99.9,100,99.7,99.6]],['Borrower ID is populated','Completeness','loan_master',99.5,[99.8,99.8,99.7,99.6,99.7,99.7]],['Borrower exists in master','Referential','loan_master',99,[99.4,99.2,99.3,98.8,98.6,98.2]],['Maturity after origination','Validity','loan_master',99.9,[100,100,100,100,99.9,100]],['Funded ≤ commitment','Consistency','loan_balances',99.5,[99.9,99.8,99.9,99.6,99.7,99.8]],['Rate within 2–20%','Accuracy','loan_master',99,[99.6,99.4,99.5,99.3,99.4,99.1]],['Rating in approved scale','Validity','loan_master',98,[98.9,98.7,98.9,97.8,97.4,97.1]],['Position feed refreshed ≤ 1 business day','Timeliness','positions',98,[99,98.6,99.1,98.7,98.9,98.5]],['Subledger ties to GL','Accuracy','gl_balances',99.5,[99.9,99.8,99.9,99.7,99.8,99.7]]];
var CAUSE=['Manual entry','Mapping / ETL logic','Missing reference data','Late feed','Source system'],ST=['Open','Investigating','Remediated','Closed'];
var I=[[101,0,'Duplicate loan IDs after amendment load',1,'High',1,'2026-10-02','Data Eng'],[102,2,'Borrowers missing from master after Sept onboarding',2,'High',0,'2026-09-28','Reference Data'],[103,6,'Legacy rating codes (NR, XX) in servicing feed',1,'Medium',1,'2026-09-21','Data Analytics'],[104,2,'Orphan IDs from acquired portfolio',2,'Medium',2,'2026-09-10','Reference Data'],[105,1,'Blank borrower IDs on manual bookings',0,'Medium',3,'2026-09-05','Operations'],[106,7,'Position feed delayed twice in October',3,'Low',0,'2026-10-12','Data Eng'],[107,5,'Rate stored as decimal in one source',1,'Low',3,'2026-08-28','Data Analytics']];
var CL=[{n:'Month-end (September)',t:[['Load GL and subledger extracts','Data Eng','2026-10-02',1],['Run data quality rules','Data Analytics','2026-10-05',1],['Tie out subledger to GL','Finance Ops','2026-10-06',1],['Resolve or document breaks','Data Analytics','2026-10-07',1],['Refresh Power BI reporting pack','Data Analytics','2026-10-08',1],['Controller sign-off','Controller','2026-10-09',1]]},
{n:'Quarter-end (Q3)',t:[['Freeze Q3 source data','Data Eng','2026-10-06',1],['Run DQ rules on full quarter','Data Analytics','2026-10-08',1],['Reconcile loan balances to GL','Finance Ops','2026-10-12',1],['Clear critical DQ issues','Data Analytics','2026-10-15',0],['Build Q3 management reporting pack','Data Analytics','2026-10-20',0],['MD and CFO review','Senior staff','2026-10-23',0]]},
{n:'Year-end (FY2026)',t:[['Confirm reference data for year-end','Reference Data','2027-01-08',0],['Run DQ rules on full year','Data Analytics','2027-01-12',0],['Reconcile year-end balances','Finance Ops','2027-01-15',0],['Resolve audit data requests','Data Analytics','2027-01-20',0],['Produce year-end reporting pack','Data Analytics','2027-01-25',0],['Sign-off and archive','Controller','2027-01-29',0]]}];
var F=[{n:'Loan subledger',src:'Servicing system',e:12480,t:12480,x:37,l:12443,at:'02:14',why:[['Null borrower ID',21],['Invalid rating code',16]]},{n:'GL balances',src:'General ledger',e:48210,t:48210,x:0,l:48210,at:'02:40',why:[]},{n:'Positions',src:'Trading platform',e:9320,t:9320,x:112,l:9190,at:'03:05',why:[['Stale price',70],['Unmapped security ID',42]]},{n:'Borrower master',src:'Reference data',e:1840,t:1840,x:5,l:1835,at:'02:22',why:[['Duplicate key',5]]}];
function last(r){return r[4][5]}function rfail(r){return last(r)<r[3]}
function age(i){return Math.round((new Date(TODAY)-new Date(i[6]))/864e5)}
function fm(x){return x.toLocaleString()}
function spark(a,th){var w=90,h=26,lo=Math.min.apply(0,a.concat(th))-.1,hi=Math.max.apply(0,a.concat(th))+.1;function y(v){return h-(v-lo)/(hi-lo)*h}
 return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><line x1="0" x2="'+w+'" y1="'+y(th)+'" y2="'+y(th)+'" stroke="var(--mu)" stroke-dasharray="3 3"/><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="'+a.map(function(v,i){return (i*w/5).toFixed(1)+','+y(v).toFixed(1)}).join(' ')+'"/></svg>'}
function card(k,v,c){return '<div class="card"><div class="k">'+k+'</div><div class="v '+(c||'')+'">'+v+'</div></div>'}
function tag(t,c){return '<span class="tag '+c+'">'+t+'</span>'}
function cstat(t){return t[3]?['Done','ok']:t[2]<TODAY?['Overdue','er']:['Upcoming','mu']}
function brk(f){return f.e-(f.l+f.x)}
function ov(){var avg=MON.map(function(m,i){return R.reduce(function(a,r){return a+r[4][i]},0)/R.length}),fails=R.filter(rfail),op=I.filter(function(i){return i[5]<3}),old=op.filter(function(i){return age(i)>14}),q=CL[1].t,qd=q.filter(function(t){return t[3]}).length,qo=q.filter(function(t){return cstat(t)[0]=='Overdue'}).length,bf=F.filter(function(f){return brk(f)});
 var lo=Math.min.apply(0,avg)-.1,hi=Math.max.apply(0,avg)+.1,W=560,H=130;function X(i){return 30+i*(W-40)/5}function Y(v){return 10+(hi-v)/(hi-lo)*(H-30)}
 var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto"><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="'+avg.map(function(v,i){return X(i)+','+Y(v)}).join(' ')+'"/>'+avg.map(function(v,i){return '<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3.5" fill="var(--ac)"/><text x="'+X(i)+'" y="'+(Y(v)-8)+'" font-size="11" text-anchor="middle" fill="var(--mu)">'+v.toFixed(1)+'</text><text x="'+X(i)+'" y="'+(H-4)+'" font-size="11" text-anchor="middle" fill="var(--mu)">'+MON[i]+'</text>'}).join('')+'</svg>';
 var by={};I.forEach(function(i){by[CAUSE[i[3]]]=(by[CAUSE[i[3]]]||0)+1});var top=Object.keys(by).sort(function(a,b){return by[b]-by[a]})[0];
 return '<div class="cards">'+card('Average pass rate',avg[5].toFixed(1)+'%')+card('Rules below threshold',fails.length+' of '+R.length,fails.length?'er':'ok')+card('Open issues',op.length)+card('Q3 close',qd+'/'+q.length+' done')+card('Feeds not reconciled',bf.length+' of '+F.length,bf.length?'er':'ok')+'</div>'+
 '<div class="card"><b>Data quality score by month-end</b>'+svg+'</div><div class="card"><b>Management summary</b><ul><li>'+fails.length+' of '+R.length+' rules are below threshold'+(fails.length?': '+fails.map(function(r){return r[0]}).join('; '):'')+'.</li><li>'+op.length+' issues are open, '+old.length+' of them older than 14 days. The most common root cause is “'+top+'”.</li><li>Quarter-end close is '+qd+' of '+q.length+' tasks complete with '+qo+' overdue.</li><li>'+(bf.length?bf.map(function(f){return f.n+' has '+fm(brk(f))+' unreconciled records'}).join('; ')+' between extract and load.':'All feeds reconcile from extract to load.')+'</li></ul></div>'}
function rules(){return '<p class="mu">Lifecycle: identify the rule, validate it against sample data, implement the threshold, then monitor each month-end. Edit a threshold to see the status update.</p><div class="card wrap"><table><thead><tr><th>Rule</th><th>Dimension</th><th>Table</th><th class="r">Threshold %</th><th class="r">Latest %</th><th>May–Oct trend</th><th>Status</th></tr></thead><tbody>'+R.map(function(r,i){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td class="r"><input size="5" value="'+r[3]+'" onchange="R['+i+'][3]=+this.value||0;draw()"></td><td class="r">'+last(r).toFixed(1)+'</td><td>'+spark(r[4],r[3])+'</td><td>'+(rfail(r)?tag('Below threshold','er'):tag('Pass','ok'))+'</td></tr>'}).join('')+'</tbody></table></div>'}
function iss(){var by={},mx=1;I.forEach(function(i){by[i[3]]=(by[i[3]]||0)+1;mx=Math.max(mx,by[i[3]])});
 return '<div class="card wrap"><table><thead><tr><th>ID</th><th>Issue</th><th>Rule</th><th>Root cause</th><th>Severity</th><th>Owner</th><th class="r">Age (days)</th><th>Status</th></tr></thead><tbody>'+I.map(function(i,n){return '<tr><td>'+i[0]+'</td><td>'+i[2]+'</td><td>'+R[i[1]][0]+'</td><td><select onchange="I['+n+'][3]=+this.value;draw()">'+CAUSE.map(function(c,k){return '<option value="'+k+'"'+(k==i[3]?' selected':'')+'>'+c+'</option>'}).join('')+'</select></td><td>'+tag(i[4],i[4]=='High'?'er':i[4]=='Medium'?'wr':'mu')+'</td><td>'+i[7]+'</td><td class="r">'+(i[5]<3?age(i):'–')+'</td><td><select onchange="I['+n+'][5]=+this.value;draw()">'+ST.map(function(s,k){return '<option value="'+k+'"'+(k==i[5]?' selected':'')+'>'+s+'</option>'}).join('')+'</select></td></tr>'}).join('')+'</tbody></table></div><h2>Root causes (all issues)</h2><div class="card">'+CAUSE.map(function(c,k){var n=by[k]||0;return '<div style="display:flex;gap:10px;align-items:center;margin:6px 0"><span style="width:170px">'+c+'</span><div class="bar" style="flex:1"><i style="width:'+100*n/mx+'%"></i></div><b>'+n+'</b></div>'}).join('')+'<p class="mu">Fixing the top cause removes the most recurring breaks. Change an issue’s status or root cause above and the chart and Overview update.</p></div>'}
function close(){var c=CL[CT],d=c.t.filter(function(t){return t[3]}).length;
 return '<div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><select onchange="CT=+this.value;draw()">'+CL.map(function(x,i){return '<option value="'+i+'"'+(i==CT?' selected':'')+'>'+x.n+'</option>'}).join('')+'</select><div class="bar" style="flex:1;min-width:120px"><i style="width:'+100*d/c.t.length+'%"></i></div><b>'+d+' of '+c.t.length+' complete</b></div></div><div class="card wrap"><table><thead><tr><th></th><th>Task</th><th>Owner</th><th>Due</th><th>Status</th></tr></thead><tbody>'+c.t.map(function(t,i){var s=cstat(t);return '<tr><td><input type="checkbox" '+(t[3]?'checked':'')+' onchange="CL['+CT+'].t['+i+'][3]=this.checked?1:0;draw()"></td><td>'+t[0]+'</td><td>'+t[1]+'</td><td>'+t[2]+'</td><td>'+tag(s[0],s[1])+'</td></tr>'}).join('')+'</tbody></table></div><p class="mu">Tick tasks off as they finish. Overdue is any open task past its due date.</p>'}
function etl(){var f=F[FD],tot=f.l+f.x;
 return '<div class="card wrap"><table><thead><tr><th>Feed</th><th>Source</th><th class="r">Extracted</th><th class="r">Transformed</th><th class="r">Rejected</th><th class="r">Loaded</th><th>Last load</th><th>Check</th></tr></thead><tbody>'+F.map(function(x,i){var b=brk(x);return '<tr class="c'+(i==FD?' sel':'')+'" onclick="FD='+i+';draw()"><td>'+x.n+'</td><td>'+x.src+'</td><td class="r">'+fm(x.e)+'</td><td class="r">'+fm(x.t)+'</td><td class="r">'+fm(x.x)+'</td><td class="r">'+fm(x.l)+'</td><td>'+x.at+'</td><td>'+(b?tag(fm(b)+' unaccounted','er'):tag('Reconciled','ok'))+'</td></tr>'}).join('')+'</tbody></table></div><h2>'+f.n+': rejected records</h2><div class="card">'+(f.why.length?f.why.map(function(w){return '<div>'+w[0]+': <b>'+w[1]+'</b></div>'}).join(''):'<span class="mu">No rejections.</span>')+'<p class="mu">Control: extracted must equal loaded plus rejected'+(brk(f)?'. Here '+fm(f.e)+' extracted vs '+fm(tot)+' accounted for, so '+fm(brk(f))+' records are missing and need investigating (a dropped batch, a filter in the transform, or a failed partial load).':'. This feed balances.')+'</p></div>'}
function draw(){var N=['Overview','1. Data quality rules','2. Issues and root causes','3. Close tracker','4. ETL and loads'],fn=[ov,rules,iss,close,etl];
 document.getElementById('app').innerHTML='<div class="tabs">'+N.map(function(n,i){return '<button class="tab'+(i==T?' on':'')+'" onclick="T='+i+';draw()">'+n+'</button>'}).join('')+'</div>'+fn[T]()}
draw();
</script></main></body></html>
